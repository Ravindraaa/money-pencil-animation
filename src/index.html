<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Money Stickman</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ec}
#stage{width:100vw;height:100vh;display:block;background:#f7f4ec}
.ink{fill:none;stroke:#25231f;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:6}.txt{font-family:Arial,sans-serif;fill:#25231f;font-weight:800}.head{font-size:64px;letter-spacing:1px}.label{font-size:38px}.number{font-size:112px}
#captions rect{fill:#25231f;opacity:.97}#cap1,#cap2{fill:#fffdf7;font-family:Arial,sans-serif;font-weight:800}
.draw{stroke-dasharray:1;stroke-dashoffset:0}.red{fill:#d84b3e}.green{fill:#4e9a68}.yellow{fill:#e8b653}
#scene .mc-enter{animation:mcEnter .48s cubic-bezier(.2,.8,.2,1) both}
#scene .mc-float{animation:mcFloat 2.8s ease-in-out infinite alternate}
#scene .mc-pulse{animation:mcPulse 1.35s ease-in-out infinite alternate}
#scene .mc-sway{animation:mcSway 2.1s ease-in-out infinite alternate}
@keyframes mcEnter{from{opacity:0;translate:0 46px}to{opacity:1;translate:0 0}}
@keyframes mcFloat{from{translate:0 0}to{translate:0 -16px}}
@keyframes mcPulse{from{scale:1}to{scale:1.045}}
@keyframes mcSway{from{rotate:-2deg}to{rotate:2deg}}
</style></head><body>
<svg id="stage" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs><pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r="1" fill="#bdb5a6" opacity=".24"/></pattern>
<g id="person" class="ink"><circle cx="0" cy="0" r="48" fill="#f7f4ec"/><path d="M-20 -7q10 -12 20 0M8 -7q10 -12 20 0M-13 18q13 12 26 0M0 48v190M0 100l-78 85M0 100l78 85M0 238l-65 130M0 238l65 130"/></g>
</defs><rect width="1080" height="1920" fill="#f7f4ec"/><rect width="1080" height="1920" fill="url(#paper)"/>
<text x="540" y="105" text-anchor="middle" class="txt label">THE MONEY STICKMAN</text><path d="M130 145H950" stroke="#b7ae9e" stroke-width="3"/>
<g id="scene"></g>
<g id="captions"><rect x="55" y="1540" width="970" height="235" rx="28"/><text id="cap1" x="540" y="1640" text-anchor="middle" font-size="48"></text><text id="cap2" x="540" y="1708" text-anchor="middle" font-size="48"></text></g></svg>
<script>
(async()=>{
const params=new URLSearchParams(location.search);let tl={segments:[]};try{const u=params.get('timeline');if(u)tl=await(await fetch(u)).json()}catch(e){}
const scene=document.getElementById('scene'),cap1=document.getElementById('cap1'),cap2=document.getElementById('cap2');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function heading(s){return '<text x="540" y="270" text-anchor="middle" class="txt head">'+esc(s.headline||'THE MONEY IDEA')+'</text><text x="540" y="340" text-anchor="middle" class="txt label">'+esc(s.subhead||'')+'</text>'}
function phone(){return '<g transform="translate(540 820)"><rect x="-230" y="-360" width="460" height="760" rx="55" fill="#292a2b" stroke="#25231f" stroke-width="15"/><rect x="-195" y="-300" width="390" height="650" rx="24" fill="#fffdf7"/><text x="0" y="-225" text-anchor="middle" class="txt label">MY BANK</text><path d="M-145 -180H145" stroke="#c9c2b5" stroke-width="4"/><text x="0" y="-85" text-anchor="middle" class="txt label">AVAILABLE BALANCE</text><text x="0" y="55" text-anchor="middle" class="txt number red">$212</text><rect x="-145" y="125" width="290" height="78" rx="15" fill="#e8b653"/><text x="0" y="177" text-anchor="middle" class="txt label">CHECKING</text><circle cx="0" cy="-335" r="9" fill="#f7f4ec"/></g><g transform="translate(540 1320) rotate(-3)"><rect x="-260" y="-70" width="520" height="120" rx="12" fill="#d84b3e"/><text x="0" y="12" text-anchor="middle" class="txt head" style="fill:white"> $70K / YEAR </text></g>'}
function paycheck(){return '<g transform="translate(540 810)"><path d="M-340 -260H340V280H-340Z" fill="#fffdf7" stroke="#25231f" stroke-width="10"/><text x="0" y="-180" text-anchor="middle" class="txt head">PAYCHECK</text><text x="-250" y="-65" class="txt label">GROSS PAY</text><text x="250" y="-65" text-anchor="end" class="txt label">$5,833</text><path d="M-250 -20H250" class="ink thin"/><g><rect x="-250" y="20" width="500" height="72" fill="#e8b653" stroke="#25231f" stroke-width="5"/><rect x="-250" y="20" width="165" height="72" fill="#d84b3e"/><text x="-165" y="70" text-anchor="middle" class="txt label" style="fill:white">TAX</text><text x="80" y="70" text-anchor="middle" class="txt label">INSURANCE</text></g><path d="M-250 140H250" stroke="#25231f" stroke-width="4"/><text x="-250" y="220" class="txt label">TAKE-HOME</text><rect x="-20" y="165" width="270" height="75" rx="12" fill="#4e9a68"/><text x="115" y="217" text-anchor="middle" class="txt label" style="fill:white">SMALLER</text></g><g transform="translate(540 1250)"><path d="M-260 0H260" class="ink"/><rect x="-220" y="-110" width="75" height="110" fill="#e8b653" stroke="#25231f" stroke-width="6"/><rect x="-125" y="-75" width="75" height="75" fill="#e8b653" stroke="#25231f" stroke-width="6"/><rect x="-30" y="-45" width="75" height="45" fill="#e8b653" stroke="#25231f" stroke-width="6"/></g>'}
function stairs(){let out='<g transform="translate(170 1120)">';for(let i=0;i<4;i++){let x=i*175,y=-i*170;out+='<path d="M'+x+' '+y+'h175v170" fill="#f0d9a7" stroke="#25231f" stroke-width="8"/><text x="'+(x+85)+'" y="'+(y+65)+'" text-anchor="middle" class="txt label">+$5K</text>';}out+='</g><g transform="translate(540 820)"><use href="#person"/></g>';out+='<g transform="translate(730 530)"><path d="M-90 70L0 -70L90 70Z" fill="#e8b653" stroke="#25231f" stroke-width="8"/><text x="0" y="45" text-anchor="middle" class="txt label">RENT</text></g><g transform="translate(825 820)"><rect x="-105" y="-65" width="210" height="130" rx="18" fill="#d9e2e6" stroke="#25231f" stroke-width="8"/><circle cx="-55" cy="65" r="25" fill="#25231f"/><circle cx="55" cy="65" r="25" fill="#25231f"/><text x="0" y="15" text-anchor="middle" class="txt label">CAR</text></g><g transform="translate(780 1120)"><rect x="-100" y="-70" width="200" height="140" rx="12" fill="#e8b653" stroke="#25231f" stroke-width="8"/><text x="0" y="15" text-anchor="middle" class="txt label">TAKEOUT</text></g>';return out}
function subscriptions(){let rows=[["STREAMING 1","$16"],["STREAMING 2","$18"],["STREAMING 3","$15"],["STREAMING 4","$20"],["GYM","$45"],["DELIVERY","$12"]];let out='<g transform="translate(540 790)"><rect x="-350" y="-350" width="700" height="700" rx="18" fill="#fffdf7" stroke="#25231f" stroke-width="9"/><text x="0" y="-270" text-anchor="middle" class="txt head">MONTHLY CHARGES</text>';rows.forEach((r,i)=>{let y=-195+i*82;out+='<path d="M-290 '+(y+30)+'H290" stroke="#c9c2b5" stroke-width="3"/><circle cx="-260" cy="'+y+'" r="23" fill="#d84b3e"/><path d="M-270 '+y+'l8 9 15 -19" stroke="white" stroke-width="6" fill="none"/><text x="-215" y="'+(y+12)+'" class="txt label">'+r[0]+'</text><text x="275" y="'+(y+12)+'" text-anchor="end" class="txt label">'+r[1]+'</text>'});out+='</g><g transform="translate(540 1280)"><rect x="-270" y="-65" width="540" height="130" rx="18" fill="#d84b3e"/><text x="0" y="22" text-anchor="middle" class="txt head" style="fill:white">$200 / MONTH</text></g>';return out}
function inflation(){return '<g transform="translate(540 820)"><ellipse cx="0" cy="250" rx="350" ry="55" fill="#e5dfd2" stroke="#25231f" stroke-width="7"/><g id="cashstack"><rect x="-240" y="80" width="480" height="150" rx="12" fill="#8ab58b" stroke="#25231f" stroke-width="8"/><rect x="-210" y="35" width="420" height="150" rx="12" fill="#a8c99e" stroke="#25231f" stroke-width="8"/><rect x="-180" y="-10" width="360" height="150" rx="12" fill="#8ab58b" stroke="#25231f" stroke-width="8"/><text x="0" y="95" text-anchor="middle" class="txt head">$ CASH $</text></g><path d="M-270 -160L-130 -80L0 -30L140 50L270 155" stroke="#d84b3e" stroke-width="14" fill="none" stroke-linecap="round"/><path d="M220 145l55 10 -8 -55" stroke="#d84b3e" stroke-width="12" fill="none"/><text x="0" y="-260" text-anchor="middle" class="txt head red">BUYING POWER ↓</text></g>'}
function split(){return '<g transform="translate(540 820)"><path d="M0 -330V330" stroke="#25231f" stroke-width="7" stroke-dasharray="14 14"/><rect x="-465" y="-280" width="420" height="510" rx="25" fill="#f3e1bc" stroke="#25231f" stroke-width="9"/><rect x="45" y="-280" width="420" height="510" rx="25" fill="#dcebdc" stroke="#25231f" stroke-width="9"/><text x="-255" y="-190" text-anchor="middle" class="txt head">50%</text><text x="-255" y="-105" text-anchor="middle" class="txt label">FOR YOUR</text><text x="-255" y="-55" text-anchor="middle" class="txt label">LIFE</text><g transform="translate(-255 80)"><use href="#person"/></g><text x="255" y="-190" text-anchor="middle" class="txt head green">50%</text><text x="255" y="-105" text-anchor="middle" class="txt label">AUTO-</text><text x="255" y="-55" text-anchor="middle" class="txt label">INVESTED</text><path d="M110 130L200 55L260 85L370 -55" stroke="#4e9a68" stroke-width="14" fill="none" stroke-linecap="round"/><path d="M320 -55H370V-5" stroke="#4e9a68" stroke-width="14" fill="none"/></g><g transform="translate(540 1280)"><rect x="-340" y="-65" width="680" height="130" rx="20" fill="#25231f"/><text x="0" y="20" text-anchor="middle" class="txt head" style="fill:white">FOLLOW FOR PART 2</text></g>'}

function cardTrap(){return '<g transform="translate(540 820)"><rect x="-330" y="-350" width="660" height="700" rx="34" fill="#fffdf7" stroke="#25231f" stroke-width="12"/><text x="0" y="-245" text-anchor="middle" class="txt head">CREDIT CARD STATEMENT</text><text x="-245" y="-120" class="txt label">APR</text><text x="190" y="-80" text-anchor="end" class="txt number red">24%</text><path d="M-250 -35H250" stroke="#d84b3e" stroke-width="12"/><text x="0" y="110" text-anchor="middle" class="txt label">INTEREST KEEPS GROWING</text><rect x="-210" y="165" width="420" height="90" rx="16" fill="#d84b3e"/><text x="0" y="228" text-anchor="middle" class="txt label" style="fill:white">THE 24% TRAP</text></g>'}
function balanceTrap(){return '<g transform="translate(540 760)"><text x="0" y="-260" text-anchor="middle" class="txt head">$6,000 BALANCE</text><rect x="-340" y="-170" width="680" height="145" rx="18" fill="#e8b653" stroke="#25231f" stroke-width="8"/><rect x="-340" y="-170" width="590" height="145" rx="18" fill="#d84b3e"/><text x="0" y="-75" text-anchor="middle" class="txt label" style="fill:white">INTEREST</text><text x="0" y="100" text-anchor="middle" class="txt label">MINIMUM PAYMENT</text><rect x="-300" y="150" width="600" height="95" rx="14" fill="#e8b653" stroke="#25231f" stroke-width="7"/><rect x="-300" y="150" width="545" height="95" rx="14" fill="#d84b3e"/><text x="0" y="215" text-anchor="middle" class="txt label" style="fill:white">MOST GOES TO INTEREST</text><path d="M-250 360H250" stroke="#25231f" stroke-width="9"/><text x="0" y="430" text-anchor="middle" class="txt label red">BALANCE BARELY MOVES</text></g>'}
function ladders(){return '<g transform="translate(270 820)"><text x="0" y="-320" text-anchor="middle" class="txt head">AVALANCHE</text><path d="M-130 250L-130 -180M130 250L130 -180" class="ink"/>'+[0,1,2,3].map(i=>'<path d="M-130 '+(170-i*100)+'H130" class="ink thin"/>').join('')+'<text x="0" y="315" text-anchor="middle" class="txt label">HIGHEST RATE FIRST</text><circle cx="0" cy="-40" r="48" fill="#4e9a68"/><path d="M-25 -40l18 20 40 -48" stroke="white" stroke-width="12" fill="none"/></g><g transform="translate(810 820)"><text x="0" y="-320" text-anchor="middle" class="txt head">SNOWBALL</text><path d="M-130 250L-130 -180M130 250L130 -180" class="ink"/>'+[0,1,2,3].map(i=>'<path d="M-130 '+(170-i*100)+'H130" class="ink thin"/>').join('')+'<text x="0" y="315" text-anchor="middle" class="txt label">SMALLEST BALANCE</text><circle cx="0" cy="-40" r="48" fill="#4e9a68"/><path d="M-25 -40l18 20 40 -48" stroke="white" stroke-width="12" fill="none"/></g>'}
function callCushion(){return '<g transform="translate(540 780)"><rect x="-300" y="-330" width="600" height="510" rx="35" fill="#fffdf7" stroke="#25231f" stroke-width="10"/><text x="0" y="-240" text-anchor="middle" class="txt head">CALL YOUR BANK</text><circle cx="0" cy="-80" r="105" fill="#e8b653" stroke="#25231f" stroke-width="9"/><path d="M-55 -120q-35 55 45 120q55 40 90 -5l-45 -55 -35 25q-30 -15 -35 -45l25 -35z" fill="#25231f"/><rect x="-245" y="55" width="490" height="95" rx="16" fill="#dcebdc"/><text x="0" y="118" text-anchor="middle" class="txt label">LOWER MY RATE?</text><g transform="translate(0 420)"><rect x="-260" y="-75" width="520" height="155" rx="22" fill="#4e9a68" stroke="#25231f" stroke-width="9"/><text x="0" y="20" text-anchor="middle" class="txt head" style="fill:white">$1,000 CUSHION</text><path d="M-420 -230L-275 -95" stroke="#d84b3e" stroke-width="15"/><path d="M-340 -100l65 5 -5 -65" stroke="#d84b3e" stroke-width="12" fill="none"/><text x="-360" y="-270" class="txt label red">CAR REPAIR</text></g></g>'}
function sendCta(){return '<g transform="translate(540 850)"><rect x="-440" y="-230" width="880" height="430" rx="28" fill="#fffdf7" stroke="#25231f" stroke-width="12"/><text x="0" y="-80" text-anchor="middle" class="txt head">SEND TO SOMEONE</text><text x="0" y="15" text-anchor="middle" class="txt head">WITH A CARD BALANCE</text><path d="M-360 90Q0 180 360 90" stroke="#d84b3e" stroke-width="18" fill="none" stroke-linecap="round"/><text x="0" y="320" text-anchor="middle" class="txt label">FOLLOW FOR MORE</text></g>'}
function semanticScene(s){
const palette={risk:'#d84b3e',debt:'#e8b653',housing:'#d9e2e6',growth:'#4e9a68',investing:'#4e9a68',budget:'#e8b653',goal:'#d9e2e6',explainer:'#e8b653'};
const colors=palette[s.scene_type]||palette.explainer;
const entities=(s.entities||[]).slice(0,3);
const labels=entities.map((v,i)=>'<g class="prop" transform="translate('+(190+i*350)+' 850)"><rect x="-125" y="-135" width="250" height="270" rx="26" fill="'+(i%2?'#fffdf7':colors)+'" stroke="#25231f" stroke-width="9"/><circle cx="0" cy="-45" r="48" fill="'+(i%2?colors:'#fffdf7')+'" stroke="#25231f" stroke-width="7"/><text x="0" y="65" text-anchor="middle" class="txt label">'+esc(v.toUpperCase())+'</text></g>').join('');
const amounts=(s.emphasis||[]).slice(0,2).map((v,i)=>'<g transform="translate('+(350+i*390)+' 1250)"><rect x="-155" y="-70" width="310" height="140" rx="24" fill="'+(i?'#25231f':colors)+'" stroke="#25231f" stroke-width="8"/><text x="0" y="22" text-anchor="middle" class="txt head" style="fill:'+(i?'#fffdf7':'#25231f')+'">'+esc(v)+'</text></g>').join('');
return '<g class="mc-enter"><g transform="translate(540 730)"><use href="#person"/></g></g>'+labels+amounts+'<path d="M540 1030Q540 1110 540 1150" stroke="#25231f" stroke-width="8" stroke-dasharray="14 12" fill="none"/>';
}
function build(s){let art=s.shot_type==='credit_card_hook'?cardTrap():s.shot_type==='credit_balance'?balanceTrap():s.shot_type==='debt_methods'?ladders():s.shot_type==='rate_call_cushion'?callCushion():s.shot_type==='debt_cta'?sendCta():s.shot_type==='bank_balance'?phone():s.shot_type==='paycheck'?paycheck():s.shot_type==='lifestyle_stairs'?stairs():s.shot_type==='subscriptions'?subscriptions():s.shot_type==='inflation_cash'?inflation():s.shot_type==='fifty_fifty'?split():semanticScene(s);return heading(s)+art}
let motionNodes=[];
function prepareMotion(){motionNodes=[...scene.querySelectorAll('g,rect,circle,ellipse,path,polygon,line,text')].filter(el=>!el.closest('#captions'));}
function animateScene(t,q){motionNodes.forEach((el,i)=>{const phase=t*2.4+i*1.71;const entrance=Math.min(1,Math.max(0,q*7-i*.025));const bob=(el.tagName==='circle'||el.tagName==='ellipse')?Math.sin(phase)*9:Math.sin(phase*.72+i)*3;el.style.translate='0px '+(46*(1-entrance)+bob*entrance)+'px';el.style.rotate=(el.tagName==='path'?Math.sin(phase*.65+i)*1.2:0)+'deg';el.style.opacity=String(entrance);});}

function chunks(text){const w=String(text||'').trim().split(/\s+/),o=[];for(let i=0;i<w.length;i+=5)o.push(w.slice(i,i+5).join(' '));return o}
function fit(el,max=880){let size=48;el.setAttribute('font-size',size);while(el.getComputedTextLength()>max&&size>28){size-=2;el.setAttribute('font-size',size)}}
window.renderAt=t=>{if(!tl.segments?.length)return;let i=tl.segments.findIndex(x=>t>=x.start&&t<x.end);if(i<0)i=tl.segments.length-1;const s=tl.segments[i],d=Math.max(.01,s.end-s.start),q=Math.max(0,Math.min(1,(t-s.start)/d));if(scene.dataset.index!==String(i)){scene.innerHTML=build(s.scene||{});scene.dataset.index=String(i);const title=scene.querySelector('.head');if(title)fit(title,900);prepareMotion()}animateScene(t,q);const words=s.words||[];if(words.length){let wi=words.findIndex(w=>t>=w.start&&t<w.end);if(wi<0)wi=words.length-1;const base=Math.floor(wi/5)*5;cap1.textContent=words.slice(base,base+5).map(w=>w.text).join(' ');cap2.textContent=words.slice(base+5,base+10).map(w=>w.text).join(' ')}else{const parts=chunks(s.text),n=Math.min(parts.length-1,Math.floor(q*parts.length));cap1.textContent=parts[n]||'';cap2.textContent=parts[n+1]||''}fit(cap1);fit(cap2);document.getElementById('captions').setAttribute('opacity',q<.015?0:1);const cash=scene.querySelector('#cashstack');if(cash)cash.setAttribute('opacity',String(1-.45*q));scene.style.opacity=String(Math.min(1,q*8+0.15));};
window.renderAt(0);
})();
</script></body></html>
