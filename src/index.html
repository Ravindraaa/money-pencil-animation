<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Money Stickman</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ec}
#stage{width:100vw;height:100vh;display:block;background:#f7f4ec}
.ink{fill:none;stroke:#25231f;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:6}.txt{font-family:Arial,sans-serif;fill:#25231f;font-weight:800}
.head{font-size:64px;letter-spacing:1px}.label{font-size:36px}.number{font-size:100px}
#captions rect{fill:#25231f;opacity:.97}#cap1,#cap2{fill:#fffdf7;font-family:Arial,sans-serif;font-weight:800}
.draw{stroke-dasharray:1;stroke-dashoffset:0}
</style></head><body>
<svg id="stage" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
 <pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r="1" fill="#bdb5a6" opacity=".24"/></pattern>
 <g id="person" class="ink"><circle cx="0" cy="0" r="52" fill="#f7f4ec"/><path d="M-22 -8q11 -12 22 0M10 -8q11 -12 22 0M-15 20q15 13 30 0M0 52v205M0 105l-85 95M0 105l85 95M0 257l-72 140M0 257l72 140"/></g>
 <g id="coin"><circle r="43" fill="#e8b653" stroke="#25231f" stroke-width="7"/><text y="15" text-anchor="middle" class="txt label">$</text></g>
 <g id="mug" class="ink"><path d="M-48 -35h96l-10 100h-76z" fill="#fffdf7"/><path d="M48 -20h22q24 0 14 30L65 35H43"/><path d="M-20 -52q-18 -20 0 -40M15 -52q-18 -20 0 -40"/></g>
</defs>
<rect width="1080" height="1920" fill="#f7f4ec"/><rect width="1080" height="1920" fill="url(#paper)"/>
<text x="540" y="110" text-anchor="middle" class="txt label">THE MONEY STICKMAN</text><path d="M140 150H940" stroke="#b7ae9e" stroke-width="3"/>
<g id="scene"></g>
<g id="captions"><rect x="65" y="1545" width="950" height="225" rx="28"/><text id="cap1" x="540" y="1640" text-anchor="middle" font-size="48"></text><text id="cap2" x="540" y="1705" text-anchor="middle" font-size="48"></text></g>
</svg>
<script>
(async()=>{
 const params=new URLSearchParams(location.search);let tl={segments:[]};
 try{const u=params.get('timeline');if(u)tl=await(await fetch(u)).json()}catch(e){}
 const scene=document.getElementById('scene'),cap1=document.getElementById('cap1'),cap2=document.getElementById('cap2');
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const wrap=(x,y,scale,body)=>'<g transform="translate('+x+' '+y+') scale('+scale+')">'+body+'</g>';
 function icon(type){
  if(type==='coffee')return wrap(0,0,1,'<use href="#mug"/>');
  if(type==='house')return '<path class="ink" d="M-110 0L0 -100L110 0V125H-110Z M-35 125V35H35V125"/>';
  if(type==='card')return '<rect x="-125" y="-80" width="250" height="160" rx="18" fill="#e8b653" stroke="#25231f" stroke-width="9"/><path class="ink" d="M-120 -25H120M-75 35H-15"/>';
  if(type==='chart')return '<path class="ink" d="M-130 100V-110M-130 100H145"/><path class="ink draw" d="M-105 65L-50 25L0 40L55 -35L115 -95"/><path class="ink" d="M75 -95H115V-55"/>';
  if(type==='warning')return '<path d="M0 -125L130 110H-130Z" fill="#e8b653" stroke="#25231f" stroke-width="9"/><path class="ink" d="M0 -45V35M0 75V78"/>';
  if(type==='target')return '<circle r="115" fill="none" stroke="#25231f" stroke-width="9"/><circle r="70" fill="none" stroke="#25231f" stroke-width="9"/><circle r="25" fill="#e8b653" stroke="#25231f" stroke-width="8"/>';
  return '<path class="ink" d="M-100 -55Q0 -120 100 -55V80Q0 135 -100 80Z M-100 -20H100"/><use href="#coin" x="0" y="30"/>';
 }
 function build(s,i){
  const kind=s.scene_type||'explainer', entity=(s.entities||[]).find(x=>['coffee','house','card','chart','warning','target','wallet'].includes(x))||'wallet';
  const nums=s.emphasis||[], headline=esc(s.headline||'THE MONEY IDEA');
  let object=icon(entity);
  if(kind==='risk')object=icon('warning');
  if(kind==='growth'||kind==='investing')object=icon('chart');
  if(kind==='housing')object=icon('house');
  if(kind==='debt')object=icon('card');
  if(kind==='goal')object=icon('target');
  const number=nums[0]?'<text x="0" y="250" text-anchor="middle" class="txt number">'+esc(nums[0])+'</text>':'';
  const secondary=nums[1]?'<text x="0" y="315" text-anchor="middle" class="txt label">'+esc(nums[1])+'</text>':'';
  const props=kind==='risk'?'FEES · TAXES · INFLATION':kind==='debt'?'BALANCE · INTEREST · PAYMENTS':kind==='housing'?'PLAN THE LARGE EXPENSES':kind==='growth'?'TIME + CONSISTENCY':kind==='investing'?'PUT MONEY TO WORK':kind==='budget'?'SMALL CHOICES ADD UP':kind==='goal'?'A PLAN YOU CAN FOLLOW':'BREAK IT DOWN';
  return '<text x="540" y="285" text-anchor="middle" class="txt head">'+headline+'</text>'+
   '<g transform="translate(270 760) scale(.72)"><use href="#person"/></g>'+
   '<g id="hero" transform="translate(700 730)"><g class="draw">'+object+'</g></g>'+
   '<path class="ink draw" d="M385 780Q500 680 555 735"/>'+
   '<text x="540" y="1190" text-anchor="middle" class="txt label">'+esc(props)+'</text>'+
   '<g>'+number+secondary+'</g>'+
   '<text x="540" y="1435" text-anchor="middle" class="txt label">'+esc((s.entities||[]).slice(0,3).join('  ·  ').toUpperCase())+'</text>';
 }
 function chunks(text){
  const words=String(text||'').trim().split(/\s+/);const out=[];
  for(let i=0;i<words.length;i+=5)out.push(words.slice(i,i+5).join(' '));
  return out;
 }
 function fit(el,max=850){let size=48;el.setAttribute('font-size',size);while(el.getComputedTextLength()>max&&size>30){size-=2;el.setAttribute('font-size',size)}}
 window.renderAt=t=>{
  if(!tl.segments?.length)return;
  let i=tl.segments.findIndex(x=>t>=x.start&&t<x.end);if(i<0)i=tl.segments.length-1;
  const s=tl.segments[i],d=Math.max(.01,s.end-s.start),q=Math.max(0,Math.min(1,(t-s.start)/d));
  if(scene.dataset.index!==String(i)){scene.innerHTML=build(s.scene||{},i);scene.dataset.index=String(i);}
  scene.querySelectorAll('.draw').forEach(p=>{p.style.strokeDasharray='1';p.style.strokeDashoffset=String(1-Math.min(1,Math.max(0,(q-.04)/.48)));});
  const h=scene.querySelector('#hero');if(h)h.setAttribute('transform','translate(700 '+(730-12*Math.sin(q*Math.PI*2))+')');
  const parts=chunks(s.text),n=Math.min(parts.length-1,Math.floor(q*parts.length));
  cap1.textContent=parts[n]||'';cap2.textContent=parts[n+1]||'';fit(cap1);fit(cap2);
  document.getElementById('captions').setAttribute('opacity',q<.02?0:1);
 };
 window.renderAt(0);
})();
</script></body></html>
