<g id="caption" text-anchor="middle">
 <rect id="captionBg" x="90" y="1570" width="900" height="180" rx="24" fill="#292722" opacity=".94"/>
 <text id="captionText" x="540" y="1645" fill="#fffdf7" font-size="48" font-family="Arial,sans-serif" font-weight="700"></text>
 <text id="captionText2" x="540" y="1705" fill="#fffdf7" font-size="48" font-family="Arial,sans-serif" font-weight="700"></text>
</g>
</svg>
<script>
(async()=>{
 const params=new URLSearchParams(location.search);
 const timelineUrl=params.get('timeline');
 let timeline={segments:[]};
 if(timelineUrl){try{timeline=await (await fetch(timelineUrl)).json()}catch(e){console.warn('Timeline fallback',e)}}
 const scenes=[...document.querySelectorAll('.scene')];
 const caption=document.getElementById('captionText');
 const caption2=document.getElementById('captionText2');
 const captionBg=document.getElementById('captionBg');
 function captionPhrase(text,local){const words=text.split(/\s+/);const groups=[];for(let i=0;i<words.length;i+=4)groups.push(words.slice(i,i+4).join(' '));const idx=Math.min(groups.length-1,Math.floor(local*groups.length));return groups.slice(idx,idx+2)}
 window.renderAt=(time)=>{
  if(!timeline.segments.length)return;
  let index=timeline.segments.findIndex(s=>time>=s.start&&time<s.end);
  if(index<0)index=time>=timeline.duration?timeline.segments.length-1:0;
  const seg=timeline.segments[index], duration=Math.max(.01,seg.end-seg.start);
  const local=Math.max(0,Math.min(1,(time-seg.start)/duration));
  const sceneIndex=Math.min(6,Math.floor(index*7/timeline.segments.length));
  scenes.forEach((el,i)=>{
    el.style.display=i===sceneIndex?'inline':'none';
    if(i===sceneIndex){
      const zoom=1.015+0.045*local;
      const drift=Math.sin(local*Math.PI*2)*10;
      el.style.transformOrigin='540px 900px';
      el.style.transform='translate('+drift+'px, '+(-drift*.35)+'px) scale('+zoom+')';
    }
    el.querySelectorAll('.draw').forEach((path)=>{
      if(!path.dataset.length){try{path.dataset.length=path.getTotalLength()}catch(e){path.dataset.length=1000}}
      const length=Number(path.dataset.length);
      path.style.strokeDasharray=length;
      path.style.strokeDashoffset=length*(1-Math.min(1,Math.max(0,(local*1.9-.05))));
      path.style.opacity=local<.04?0:1;
    });
  });
  const [line1,line2]=captionPhrase(seg.text,local);
  caption.textContent=line1||''; caption2.textContent=line2||'';
  caption.setAttribute('font-size','52'); caption2.setAttribute('font-size','52');
  caption.setAttribute('y','1645'); caption2.setAttribute('y','1710');
  captionBg.setAttribute('opacity',local<.02?'0':'0.94');
  const pop=0.96+0.04*Math.min(1,local*12);
  document.getElementById('caption').setAttribute('transform','translate(540 1660) scale('+pop+') translate(-540 -1660)');
 };
 window.renderAt(0);
})();
</script>
</body>
</html>
