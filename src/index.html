<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Money Stickman</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ec}#stage{width:100vw;height:100vh;display:block}.ink{fill:none;stroke:#292722;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:7}.txt{font-family:Arial,sans-serif;fill:#292722;font-weight:800}.small{font-size:36px}.big{font-size:100px}.scene{display:none}.accent{fill:#d69a37;stroke:#292722;stroke-width:7}.green{fill:#a9b98b;stroke:#292722;stroke-width:7}.paper{fill:#f7f4ec;stroke:#292722;stroke-width:9}</style></head>
<body><svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M2 5h3M14 18h2" stroke="#b9b2a5" opacity=".2"/></pattern>
<g id="stickman" class="ink"><circle cx="0" cy="0" r="58" fill="#f7f4ec"/><path d="M-25 -10q12 -12 24 0M12 -10q12 -12 24 0M-15 25q15 12 30 0M0 58v180M0 105l-95 95M0 105l95 95M0 238l-75 130M0 238l75 130"/></g>
<g id="cup"><path class="paper" d="M-55 -45h110l-12 115h-86z"/><path class="ink thin" d="M55 -30h28q18 0 12 28l-20 35H48"/><path class="ink thin" d="M-25 -65q-20 -25 0 -45M10 -65q-20 -25 0 -45"/></g>
</defs>
<rect width="1080" height="1920" fill="#f7f4ec"/><rect width="1080" height="1920" fill="url(#grain)"/>
<text x="540" y="125" text-anchor="middle" class="txt small" letter-spacing="7" fill="#82796c">THE MONEY STICKMAN</text><path d="M180 160H900" stroke="#aaa194" stroke-width="3"/>
<!-- 0: actual coffee purchase and $7 menu -->
<g id="s0" class="scene">
 <path class="ink" d="M120 1110H960M190 1110V470H890V1110"/>
 <rect x="650" y="520" width="205" height="170" rx="12" class="green"/><text x="752" y="585" text-anchor="middle" class="txt small">COFFEE</text><text x="752" y="655" text-anchor="middle" class="txt big">$7</text>
 <g id="coffeeCup" transform="translate(520 930) scale(1.8)"><use href="#cup"/></g>
 <g id="barista" transform="translate(270 700) scale(.85)"><use href="#stickman"/></g>
 <g id="buyer" transform="translate(500 700) scale(.85)"><use href="#stickman"/></g>
 <path id="handCoffee" class="ink" d="M500 805Q530 850 520 875"/>
 <text x="540" y="1300" text-anchor="middle" class="txt big">ONE COFFEE = $7</text>
</g>
<!-- 1: five weekday coffees -->
<g id="s1" class="scene">
 <text x="540" y="400" text-anchor="middle" class="txt big">MON  TUE  WED  THU  FRI</text>
 <path class="ink" d="M120 500H960"/>
 <g id="cups5">
 <g transform="translate(190 770) scale(.9)"><use href="#cup"/></g><g transform="translate(365 770) scale(.9)"><use href="#cup"/></g><g transform="translate(540 770) scale(.9)"><use href="#cup"/></g><g transform="translate(715 770) scale(.9)"><use href="#cup"/></g><g transform="translate(890 770) scale(.9)"><use href="#cup"/></g></g>
 <text x="540" y="1080" text-anchor="middle" class="txt big">$7 × 5 = $35</text><text x="540" y="1170" text-anchor="middle" class="txt small">EVERY WEEKDAY</text>
 <g transform="translate(540 1390) scale(.65)"><use href="#stickman"/></g>
</g>
<!-- 2: calendar and annual spend -->
<g id="s2" class="scene">
 <rect x="260" y="430" width="560" height="580" rx="24" class="paper"/><path class="ink" d="M260 570H820M390 400V500M690 400V500"/>
 <text x="540" y="525" text-anchor="middle" class="txt big">50 WEEKS</text>
 <g fill="#d69a37" stroke="#292722" stroke-width="5"><rect x="330" y="630" width="110" height="100" rx="12"/><rect x="485" y="630" width="110" height="100" rx="12"/><rect x="640" y="630" width="110" height="100" rx="12"/><rect x="330" y="780" width="110" height="100" rx="12"/><rect x="485" y="780" width="110" height="100" rx="12"/></g>
 <text x="540" y="1130" text-anchor="middle" class="txt big">$1,750</text><text x="540" y="1200" text-anchor="middle" class="txt small">COFFEE SPENDING / YEAR</text>
 <g transform="translate(540 1450) scale(.55)"><use href="#stickman"/></g>
</g>
<!-- 3: divert $35 into investment -->
<g id="s3" class="scene">
 <g transform="translate(280 700) scale(.75)"><use href="#stickman"/></g>
 <path class="ink" d="M420 830Q520 750 650 850"/>
 <circle id="coin" cx="520" cy="770" r="54" class="accent"/><text x="520" y="790" text-anchor="middle" class="txt small">$35</text>
 <path class="ink" d="M700 800h190v220q-95 90-190 0z"/><path class="ink thin" d="M740 800v-65h110v65"/>
 <text x="795" y="930" text-anchor="middle" class="txt small">INVEST</text>
 <text x="540" y="1210" text-anchor="middle" class="txt big">$35 / WEEK</text><text x="540" y="1290" text-anchor="middle" class="txt small">50 WEEKS × 15 YEARS</text>
</g>
<!-- 4: compound growth -->
<g id="s4" class="scene">
 <path class="ink" d="M170 1080V470H920M210 1020L390 930L560 820L730 650L875 500"/>
 <path class="ink" d="M835 500l45 0-5 48"/>
 <g fill="#d69a37" stroke="#292722" stroke-width="6"><circle cx="390" cy="930" r="18"/><circle cx="560" cy="820" r="18"/><circle cx="730" cy="650" r="18"/></g>
 <text x="540" y="1230" text-anchor="middle" class="txt big">$45,500</text><text x="540" y="1310" text-anchor="middle" class="txt small">AFTER 15 YEARS*</text>
 <text x="540" y="1400" text-anchor="middle" class="txt small">YOU PUT IN  $26,250</text><text x="540" y="1470" text-anchor="middle" class="txt small">GROWTH  ~$19,250</text>
</g>
<!-- 5: uncertainty, down markets, costs -->
<g id="s5" class="scene">
 <path class="ink" d="M170 1050V500H910M210 650l150 100 130-80 150 180 140-130 170 160"/>
 <text x="540" y="400" text-anchor="middle" class="txt big">7% IS NOT GUARANTEED</text>
 <g class="txt small" text-anchor="middle"><text x="300" y="1250">FEES</text><text x="540" y="1250">TAXES</text><text x="780" y="1250">INFLATION</text></g>
 <g class="ink thin"><circle cx="300" cy="1160" r="45"/><path d="M280 1160h40M540 1115v90M500 1160h80M780 1115l-35 90M745 1115l70 90"/></g>
</g>
<!-- 6: keep coffee, choose a valued goal -->
<g id="s6" class="scene">
 <g transform="translate(300 760) scale(1.15)"><use href="#stickman"/></g><g transform="translate(300 1010) scale(1.05)"><use href="#cup"/></g>
 <path class="ink" d="M540 900H700l-30 -30m30 30l-30 30"/>
 <path class="ink" d="M760 800h150v160q-75 75-150 0zM790 800v-55h90v55"/>
 <text x="835" y="900" text-anchor="middle" class="txt small">GOAL</text>
 <text x="540" y="1250" text-anchor="middle" class="txt big">SPEND WITH PURPOSE</text><text x="540" y="1340" text-anchor="middle" class="txt small">SAVE FOR WHAT MATTERS</text>
</g>
<g id="captions"><rect x="70" y="1580" width="940" height="190" rx="28" fill="#292722" opacity=".96"/><text id="cap1" x="540" y="1660" text-anchor="middle" fill="#fffdf7" font-family="Arial" font-size="48" font-weight="800"></text><text id="cap2" x="540" y="1720" text-anchor="middle" fill="#fffdf7" font-family="Arial" font-size="48" font-weight="800"></text></g>
</svg>
<script>
(async()=>{const p=new URLSearchParams(location.search),u=p.get('timeline');let tl={segments:[]};if(u){try{tl=await(await fetch(u)).json()}catch(e){}}const ids=['s0','s1','s2','s3','s4','s5','s6'].map(id=>document.getElementById(id));const c1=document.getElementById('cap1'),c2=document.getElementById('cap2');
function splitCaption(s,local){const words=s.replace(/[.,:;!?]/g,'').split(/\s+/);const chunks=[];for(let i=0;i<words.length;i+=5)chunks.push(words.slice(i,i+5).join(' '));const n=Math.min(chunks.length-1,Math.floor(local*chunks.length));return[chunks[n]||'',chunks[n+1]||''];}
window.renderAt=t=>{if(!tl.segments.length)return;let i=tl.segments.findIndex(x=>t>=x.start&&t<x.end);if(i<0)i=tl.segments.length-1;const s=tl.segments[i],d=Math.max(.01,s.end-s.start),q=Math.max(0,Math.min(1,(t-s.start)/d));ids.forEach((el,j)=>{el.style.display=j===i?'inline':'none';if(j===i){const scale=1+.025*Math.sin(q*Math.PI);el.style.transformOrigin='540px 950px';el.style.transform='translate('+Math.sin(q*6.28)*12+'px,0) scale('+scale+')';}});
if(i===0){document.getElementById('coffeeCup').setAttribute('transform','translate(520 '+(930-25*Math.sin(q*Math.PI*2)) +') scale(1.8)');document.getElementById('buyer').setAttribute('transform','translate(500 700) scale(.85) rotate('+(-8+16*q)+' 0 120)');}
if(i===1){document.getElementById('cups5').setAttribute('transform','translate(0 '+(20*(1-q))+')');}
if(i===3){const coin=document.getElementById('coin');coin.setAttribute('cy',770+170*q);coin.setAttribute('cx',520+180*q);}
if(i===4){const graph=document.querySelector('#s4 path:nth-of-type(2)');if(graph)graph.style.strokeDasharray='900';if(graph)graph.style.strokeDashoffset=900*(1-q);}
const pair=splitCaption(s.text,q);c1.textContent=pair[0];c2.textContent=pair[1];document.getElementById('captions').setAttribute('opacity',q<.015?0:1);};window.renderAt(0);})();
</script></body></html>
