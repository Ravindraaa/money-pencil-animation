name: Render Money Stickman Short

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: |
          npm install
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Render video
        run: npm run render:short
      - name: Validate MP4
        run: npm run qa
      - name: Upload review files
        uses: actions/upload-artifact@v4
        with:
          name: money-stickman-short-01
          path: |
            output/money-stickman-short-01.mp4
            output/short-01-metadata.json
          if-no-files-found: error
          retention-days: 14