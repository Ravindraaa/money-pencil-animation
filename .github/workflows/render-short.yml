name: Render Money Stickman Short

on:
  workflow_dispatch:
    inputs:
      script_file:
        description: 'Script JSON file under scripts/ (for example short_01.json)'
        required: true
        default: 'scripts/short_70k.json'
      output_name:
        description: 'Output MP4 base name (without extension)'
        required: true
        default: 'money-stickman-70k'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/render-short.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/render-short.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: |
          npm install
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test semantic storyboard planner
        run: python -m unittest discover -s tests -v
      - name: Render video
        env:
          SHORT_SPEC: ${{ github.event.inputs.script_file || 'scripts/short_70k.json' }}
          OUTPUT_NAME: ${{ github.event.inputs.output_name || 'money-stickman-70k' }}
        run: npm run render:short
      - name: Validate MP4
        env:
          OUTPUT_NAME: ${{ github.event.inputs.output_name || 'money-stickman-70k' }}
        run: python scripts/qa_video.py "output/${OUTPUT_NAME}.mp4"
      - name: Upload review files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.output_name || 'money-stickman-70k' }}
          path: |
            output/${{ github.event.inputs.output_name || 'money-stickman-70k' }}.mp4
            output/${{ github.event.inputs.output_name || 'money-stickman-70k' }}-metadata.json
            output/${{ github.event.inputs.output_name || 'money-stickman-70k' }}-storyboard.json
          if-no-files-found: error
          retention-days: 14